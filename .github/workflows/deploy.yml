# Test, then publish to GitHub Pages.
#
# ubuntu-latest already ships g++, rustc and python3, so the compiled-language
# paths are exercised on every push whether or not the local runner was up on
# the machine the commit came from. That is what keeps the C++ and Rust reference
# solutions honest: tests/content.test.mjs compiles and runs every one of them
# against the problem's own hidden cases.

name: test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Which toolchains this runner has
        run: |
          g++ --version | head -1
          rustc --version
          python3 --version
          node --version

      - run: npm ci

      # The whole suite, including the judge's own tests and every code
      # problem's reference solution compiled with the profile it asks for.
      - run: npm test

      # A stale index would mean the catalog disagrees with the problem files,
      # which is invisible until a problem fails to open.
      - name: The committed index matches the problem files
        run: npm run check:index

      # The README counts problems, topics, concepts and readings. Those were
      # hand-written once and were wrong within a day, so they are generated
      # and checked rather than maintained.
      - name: The README matches the catalogue
        run: node scripts/build-readme.mjs --check

      # An assessment that names a practice problem is an assessment made of
      # questions you have already seen; one that names a problem that does
      # not exist is a mode that cannot be started. Both are content
      # mistakes and both are caught here rather than in a browser.
      - name: The assessment definitions are valid
        run: npm run check:assessments

      # An answer key in problems/ would be served alongside the problem it
      # answers, which defeats the one bit of answer-hiding a static site has.
      - name: No answer key leaked into problems/
        run: |
          if grep -rl '"key"' problems/ 2>/dev/null | grep -q .; then
            echo "A problem file contains a \"key\" field. Keys belong in solutions/."
            grep -rl '"key"' problems/
            exit 1
          fi
          echo "ok"

      # The subtler leak: a statement that hands over the answer in prose or
      # in its own starting template. Each deliberate one is declared in
      # scripts/leak-allow.json, so a new undeclared one fails here.
      - name: No statement gives its own answer away
        run: npm run audit:leaks

      # data/cxx-support.json says which C++ problems the in-browser compiler
      # is certified for, and it is generated by compiling every one of them.
      # A stale file would offer the browser compiler for a problem it cannot
      # actually run, or withhold it from one it can.
      - name: The browser C++ support list matches the problems
        run: npm run check:cxx

      # The same for Python: data/py-support.json is generated by running
      # every Python reference solution on the vendored Pyodide.
      - name: The browser Python support list matches the problems
        run: npm run check:py

      # And for Rust. This one matters more than the other two, because the
      # browser rustc cannot run every Rust problem — its Cranelift backend
      # has no i64 smulhi, so parse::<i64>() does not compile. A stale list
      # would offer the in-browser compiler for a problem that cannot build
      # with it, and the reader would get a compiler error about an opcode.
      - name: The browser Rust support list matches the problems
        run: npm run check:rust

      # The compiler itself is pinned by sha256. It is the one dependency
      # that executes code, so an artifact that is not the pinned build is a
      # failed build rather than something to notice later.
      - name: The vendored Rust toolchain is the pinned build
        run: npm run check:vendor-rust

      # And for the hardware exercises. The support list is produced by
      # compiling each reference design with BOTH its sample and its
      # grading testbench and requiring every named check to pass, and
      # the feature table is a program per language feature with its
      # expected output stated in advance. A stale file would publish a
      # supported subset that nothing had verified.
      - name: The SystemVerilog support list and feature table match
        run: npm run check:hdl

      # The simulator is pinned by sha256, like the Rust one, and for
      # the same reason: it is a dependency that executes code. It is
      # also GPL-2.0-or-later, so the pin is what makes "redistributed
      # unmodified, from this exact commit" a checkable claim rather
      # than a sentence in a README.
      - name: The vendored Verilog simulator is the pinned build
        run: npm run check:vendor-hdl

      # The local runner writes data/judge-token.json on every start. It is in
      # .gitignore, but the deploy job publishes the whole checkout, so a
      # mistake here would put a live credential on a public URL.
      - name: No runner token in the files that get published
        run: |
          found=$(find . -path ./node_modules -prune -o -name 'judge-token*.json' -print)
          if [ -n "$found" ]; then
            echo "A runner token file is in the tree and would be deployed:"
            echo "$found"
            exit 1
          fi
          echo "ok"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The whole repo is the site: no build step, no bundler. node_modules is
      # not present because npm ci is not run in this job.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
